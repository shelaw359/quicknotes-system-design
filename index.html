```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes - Notes Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Manage your notes with ease.</p>
    </header>

    <main>
        <section class="note-form-section">
            <h2>Create a Note</h2>

            <form id="note-form">
                <label for="title-input">Note Title</label>
                <input
                    type="text"
                    id="title-input"
                    name="title"
                    maxlength="100"
                    required
                    placeholder="Enter note title"
                >

                <label for="body-input">Note Body (optional)</label>
                <textarea
                    id="body-input"
                    name="body"
                    rows="4"
                    placeholder="Write your note here"
                ></textarea>

                <button type="submit" id="submit-btn">Create Note</button>
            </form>
        </section>

        <section class="notes-section">
            <h2>Your Notes</h2>

            <button type="button" id="load-btn">Load Notes</button>

            <p id="status" role="status" aria-live="polite"></p>

            <ul id="notes-list"></ul>
        </section>
    </main>

    <footer>
        <p>QuickNotes System Design Project</p>
    </footer>
</body>
</html>
```
